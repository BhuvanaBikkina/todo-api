<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <h1><i class="fa-solid fa-list-check"></i> Task Manager</h1>
        </nav>
    </header>

    <main class="container">

        <section class="hero">
            <h2>Manage Your Daily Tasks</h2>
            <p>Stay organized and boost your productivity.</p>
        </section>

        <section class="stats">
            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>
        </section>

        <section class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button onclick="addTask()">
                <i class="fa-solid fa-plus"></i> Add Task
            </button>
        </section>

        <section class="task-section">
            <h3><i class="fa-solid fa-clipboard-list"></i> My Tasks</h3>
            <ul id="taskList"></ul>
        </section>

    </main>

    <footer>
        <p>© 2026 Task Manager | Built with Spring Boot</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
